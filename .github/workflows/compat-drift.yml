name: compat-drift

# Weekly live contract test: does Google's current PSI output still match our audit registry?
# Opens an issue on drift. No-ops if PSI_API_KEY secret is unset (REQ-COMPAT-008).
on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract test (skips cleanly without a key)
        env:
          PSI_API_KEYS: ${{ secrets.PSI_API_KEY }}
        run: |
          if [ -z "$PSI_API_KEYS" ]; then
            echo "No PSI_API_KEY secret set — skipping live drift check (runtime compat_status is the backstop)."
            exit 0
          fi
          pytest -q tests/contract -m live || echo "DRIFT_DETECTED=1" >> "$GITHUB_ENV"
      - name: Open issue on drift
        if: env.DRIFT_DETECTED == '1'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: "compat drift: live PSI audit IDs diverged from the registry",
              body: "The weekly contract test found audit IDs added/removed/renamed vs " +
                    "`registry.json`. Update the registry (CalVer bump) and reconcile the parsers.",
              labels: ["compat-drift"],
            })
